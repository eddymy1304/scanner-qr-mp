name: ScannerSampleIos
options:
  bundleIdPrefix: com.eddymy1304.scanner
  deploymentTarget:
    iOS: "15.0"
targets:
  ScannerSampleIos:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Necesitamos la cámara para escanear códigos QR y de barras."
        # Requerido por Compose Multiplatform en iPhones con alta tasa de refresco.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDisplayName: "Scanner Swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eddymy1304.scanner.sample.ios
        SWIFT_VERSION: "5.9"
        # Framework estático: solo link, sin embed.
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../../scanner/build/XCFrameworks/debug"
        # CMP 1.11+ ya no publica x86_64 para simulador (solo arm64).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    dependencies:
      - framework: ../../scanner/build/XCFrameworks/debug/ScannerQrMp.xcframework
        embed: false
